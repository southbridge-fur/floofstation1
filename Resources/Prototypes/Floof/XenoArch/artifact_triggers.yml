- type: artifactTrigger
  id: TriggerReproductive
  targetDepth: 1
  triggerHint: artifact-trigger-hint-reproductive
  components:
  - type: Reactive
    groups:
      Acidic: [ Touch ]
    reactions:
    - reagents:
      - Cum
      - NaturalLubricant
      - Milk
      - Philterex
      - Pomelustine
      - Libidozenithizine
      methods: [ Touch ]
      effects:
      - !type:ActivateArtifact

